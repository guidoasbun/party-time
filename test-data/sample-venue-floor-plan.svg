<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wall { fill: none; stroke: #2c3e50; stroke-width: 4; }
      .door { fill: none; stroke: #95a5a6; stroke-width: 3; stroke-dasharray: 10,5; }
      .label { font-family: Arial, sans-serif; font-size: 18px; fill: #34495e; font-weight: bold; }
      .sublabel { font-family: Arial, sans-serif; font-size: 14px; fill: #7f8c8d; }
      .room-fill { fill: #ecf0f1; opacity: 0.3; }
      .stage-fill { fill: #3498db; opacity: 0.2; }
      .kitchen-fill { fill: #e74c3c; opacity: 0.1; }
      .entrance-fill { fill: #2ecc71; opacity: 0.1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Outer Walls -->
  <rect x="50" y="50" width="1100" height="700" class="wall"/>

  <!-- Main Ballroom/Hall -->
  <rect x="50" y="50" width="850" height="700" class="room-fill"/>
  <text x="475" y="410" class="label" text-anchor="middle">MAIN BALLROOM</text>
  <text x="475" y="435" class="sublabel" text-anchor="middle">850 sq ft</text>

  <!-- Stage Area (top center) -->
  <rect x="350" y="50" width="300" height="120" class="stage-fill"/>
  <rect x="350" y="50" width="300" height="120" class="wall"/>
  <text x="500" y="115" class="label" text-anchor="middle">STAGE</text>

  <!-- Kitchen (right side) -->
  <rect x="900" y="50" width="250" height="300" class="kitchen-fill"/>
  <rect x="900" y="50" width="250" height="300" class="wall"/>
  <text x="1025" y="195" class="label" text-anchor="middle">KITCHEN</text>
  <text x="1025" y="220" class="sublabel" text-anchor="middle">Service Area</text>

  <!-- Kitchen Door -->
  <line x1="900" y1="250" x2="900" y2="310" class="door"/>

  <!-- Storage Room (right side, below kitchen) -->
  <rect x="900" y="350" width="250" height="200" class="room-fill"/>
  <rect x="900" y="350" width="250" height="200" class="wall"/>
  <text x="1025" y="445" class="label" text-anchor="middle">STORAGE</text>

  <!-- Storage Door -->
  <line x1="900" y1="420" x2="900" y2="480" class="door"/>

  <!-- Restrooms (right side, bottom) -->
  <rect x="900" y="550" width="120" height="200" class="room-fill"/>
  <rect x="900" y="550" width="120" height="200" class="wall"/>
  <text x="960" y="635" class="label" text-anchor="middle">MEN'S</text>
  <text x="960" y="655" class="label" text-anchor="middle">ROOM</text>

  <rect x="1020" y="550" width="130" height="200" class="room-fill"/>
  <rect x="1020" y="550" width="130" height="200" class="wall"/>
  <text x="1085" y="635" class="label" text-anchor="middle">WOMEN'S</text>
  <text x="1085" y="655" class="label" text-anchor="middle">ROOM</text>

  <!-- Restroom Doors -->
  <line x1="900" y1="620" x2="900" y2="680" class="door"/>
  <line x1="1020" y1="620" x2="1020" y2="680" class="door"/>

  <!-- Main Entrance (bottom left) -->
  <rect x="50" y="650" width="200" height="100" class="entrance-fill"/>
  <rect x="50" y="650" width="200" height="100" class="wall"/>
  <text x="150" y="705" class="label" text-anchor="middle">ENTRANCE</text>

  <!-- Main Entrance Doors (double doors) -->
  <line x1="100" y1="750" x2="100" y2="710" class="door" stroke-width="5"/>
  <line x1="200" y1="750" x2="200" y2="710" class="door" stroke-width="5"/>

  <!-- Side Exit (left side) -->
  <line x1="50" y1="350" x2="90" y2="350" class="door"/>
  <text x="70" y="340" class="sublabel" text-anchor="middle">EXIT</text>

  <!-- Bar Area (bottom right corner of main hall) -->
  <rect x="700" y="600" width="200" height="150" class="room-fill" fill="#f39c12" opacity="0.15"/>
  <rect x="700" y="600" width="200" height="150" class="wall" stroke-dasharray="5,5"/>
  <text x="800" y="680" class="label" text-anchor="middle">BAR AREA</text>
  <text x="800" y="700" class="sublabel" text-anchor="middle">(suggested)</text>

  <!-- DJ Booth Area (top right corner of main hall) -->
  <circle cx="800" cy="250" r="60" class="room-fill" fill="#9b59b6" opacity="0.15"/>
  <circle cx="800" cy="250" r="60" class="wall" stroke-dasharray="5,5"/>
  <text x="800" y="250" class="label" text-anchor="middle">DJ</text>
  <text x="800" y="268" class="sublabel" text-anchor="middle">BOOTH</text>

  <!-- Dance Floor (center) -->
  <rect x="300" y="400" width="350" height="250" class="room-fill" fill="#1abc9c" opacity="0.1"/>
  <rect x="300" y="400" width="350" height="250" class="wall" stroke-dasharray="8,4" stroke-width="2"/>
  <text x="475" y="520" class="label" text-anchor="middle" fill="#16a085">DANCE FLOOR</text>
  <text x="475" y="545" class="sublabel" text-anchor="middle">(suggested placement)</text>

  <!-- Dimensions/Scale Reference -->
  <line x1="70" y1="780" x2="220" y2="780" stroke="#95a5a6" stroke-width="1"/>
  <line x1="70" y1="775" x2="70" y2="785" stroke="#95a5a6" stroke-width="1"/>
  <line x1="220" y1="775" x2="220" y2="785" stroke="#95a5a6" stroke-width="1"/>
  <text x="145" y="797" class="sublabel" text-anchor="middle" font-size="12">15 ft</text>

  <!-- Title and Details -->
  <text x="600" y="35" class="label" text-anchor="middle" font-size="22">GRAND BALLROOM - FLOOR PLAN</text>
  <text x="1100" y="35" class="sublabel" text-anchor="end" font-size="12">Sample Venue Layout</text>

  <!-- Legend -->
  <text x="60" y="25" class="sublabel" font-size="12">Legend:</text>
  <line x1="120" y1="22" x2="150" y2="22" class="wall"/>
  <text x="155" y="25" class="sublabel" font-size="11">Walls</text>
  <line x1="210" y1="22" x2="240" y2="22" class="door"/>
  <text x="245" y="25" class="sublabel" font-size="11">Doors</text>
  <line x1="290" y1="22" x2="320" y2="22" class="wall" stroke-dasharray="5,5"/>
  <text x="325" y="25" class="sublabel" font-size="11">Suggested Areas</text>
</svg>
