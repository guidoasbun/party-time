# Alembic configuration file

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone to use for timestamp in migration file names
timezone = UTC

# Truncate length of slug in migration file names
truncate_slug_length = 40

# Set to 'true' to run environment during revision command
revision_environment = false

# SQLAlchemy URL - will be overridden in env.py to use async
# This is the development database (Docker PostgreSQL)
# Production will use AWS RDS configured via environment variables
sqlalchemy.url = postgresql://party_admin:party_secure_2024@localhost:5432/party_time

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S