name: Deploy to Staging

on:
  push:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'documentation/**'
      - 'infrastructure/terraform/**'  # Handled by infrastructure.yml

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '412381751532'
  ECR_REGISTRY: 412381751532.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: party-time-staging-cluster
  FRONTEND_SERVICE: party-time-staging-frontend
  BACKEND_SERVICE: party-time-staging-backend
  CELERY_WORKER_SERVICE: party-time-staging-celery-worker
  CELERY_BEAT_SERVICE: party-time-staging-celery-beat
  FRONTEND_IMAGE: party-time-staging-frontend
  BACKEND_IMAGE: party-time-staging-backend
  CELERY_IMAGE: party-time-staging-celery
  STAGING_URL: https://staging.celebration-time.com

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # BUILD AND PUSH IMAGES
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/party-time-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infrastructure/docker/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.STAGING_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.STAGING_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push celery image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.CELERY_IMAGE }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.CELERY_IMAGE }}:latest
          cache-from: type=gha,scope=celery
          cache-to: type=gha,mode=max,scope=celery

  # ============================================================================
  # RUN DATABASE MIGRATIONS
  # ============================================================================
  run-migrations:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/party-time-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Get network configuration
        id: network
        run: |
          # Get the private subnets from the ECS service configuration
          SERVICE_INFO=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.BACKEND_SERVICE }} \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)

          SUBNETS=$(echo $SERVICE_INFO | jq -r '.subnets | join(",")')
          SECURITY_GROUPS=$(echo $SERVICE_INFO | jq -r '.securityGroups | join(",")')

          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "security_groups=$SECURITY_GROUPS" >> $GITHUB_OUTPUT
          echo "Subnets: $SUBNETS"
          echo "Security Groups: $SECURITY_GROUPS"

      - name: Run database migrations
        run: |
          echo "Starting database migrations..."

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition party-time-staging-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.network.outputs.subnets }}],securityGroups=[${{ steps.network.outputs.security_groups }}],assignPublicIp=DISABLED}" \
            --overrides '{
              "containerOverrides": [{
                "name": "backend",
                "command": ["alembic", "upgrade", "head"]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "Error: Failed to start migration task"
            exit 1
          fi

          echo "Migration task started: $TASK_ARN"
          echo "Waiting for task to complete..."

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration FAILED!"
            STOP_REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks $TASK_ARN \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "Stop reason: $STOP_REASON"
            exit 1
          fi

          echo "Migrations completed successfully!"

  # ============================================================================
  # DEPLOY TO ECS
  # ============================================================================
  deploy-ecs:
    needs: [build-and-push, run-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/party-time-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS services
        run: |
          echo "Deploying to ECS cluster: ${{ env.ECS_CLUSTER }}"
          echo ""

          SERVICES="${{ env.FRONTEND_SERVICE }} ${{ env.BACKEND_SERVICE }} ${{ env.CELERY_WORKER_SERVICE }} ${{ env.CELERY_BEAT_SERVICE }}"

          for SERVICE in $SERVICES; do
            echo "Updating service: $SERVICE"
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service $SERVICE \
              --force-new-deployment \
              --query 'service.serviceName' \
              --output text
          done

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for services to stabilize (timeout: 10 minutes)..."

          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.FRONTEND_SERVICE }} ${{ env.BACKEND_SERVICE }} ${{ env.CELERY_WORKER_SERVICE }} ${{ env.CELERY_BEAT_SERVICE }}

          echo "All services are stable!"

  # ============================================================================
  # SMOKE TESTS
  # ============================================================================
  smoke-tests:
    needs: deploy-ecs
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Health check - API
        run: |
          echo "Checking API health endpoint..."
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.STAGING_URL }}/health" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "API health check PASSED (HTTP $HTTP_CODE)"
              exit 0
            fi

            echo "Attempt $i/30 - Got HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done

          echo "API health check FAILED after 30 attempts"
          exit 1

      - name: Health check - API Documentation
        run: |
          echo "Checking API documentation..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.STAGING_URL }}/docs" 2>/dev/null || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "API docs check PASSED (HTTP $HTTP_CODE)"
          else
            echo "API docs check FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Health check - Frontend
        run: |
          echo "Checking frontend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.STAGING_URL }}/" 2>/dev/null || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Frontend check PASSED (HTTP $HTTP_CODE)"
          else
            echo "Frontend check FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Verify ALB target health
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # Note: This step requires AWS credentials, but we're in a different job
          # Skip for now as the HTTP checks above are sufficient
          echo "ALB target health verification skipped (HTTP checks passed)"

  # ============================================================================
  # NOTIFICATION
  # ============================================================================
  notify:
    needs: [build-and-push, deploy-ecs, smoke-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/party-time-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.smoke-tests.result }}" == "success" ]]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "No notification email configured, skipping..."
            exit 0
          fi

          STATUS="${{ steps.status.outputs.status }}"
          EMOJI="${{ steps.status.outputs.emoji }}"

          SUBJECT="$EMOJI [Party-Time] Staging Deployment $STATUS"

          if [ "$STATUS" = "SUCCESS" ]; then
            MESSAGE="Staging deployment completed successfully.

Commit: ${{ github.sha }}
Branch: staging
Actor: ${{ github.actor }}
URL: ${{ env.STAGING_URL }}

Deployed services:
- Frontend
- Backend
- Celery Worker
- Celery Beat

View workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            MESSAGE="Staging deployment FAILED.

Commit: ${{ github.sha }}
Branch: staging
Actor: ${{ github.actor }}

Please check the GitHub Actions logs for details:
${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          # Try to send via SES (may fail if not configured)
          aws ses send-email \
            --from "noreply@celebration-time.com" \
            --destination "ToAddresses=$NOTIFICATION_EMAIL" \
            --message "Subject={Data='$SUBJECT',Charset=UTF-8},Body={Text={Data='$MESSAGE',Charset=UTF-8}}" \
            2>/dev/null || echo "Email notification skipped (SES not configured or domain not verified)"

      - name: Post deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** ${{ env.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
